- id: odoo-lint
  name: odoo-lint
  description: "Lint Odoo addons with odoo-lint: pylint-odoo and oca-checks-po checks, in Rust"
  entry: odl check --force-exclude
  language: python
  files: \.(py|xml|po|pot|js)$
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
- id: odoo-lint-advisory
  name: odoo-lint (advisory)
  description: "odoo-lint's findings on every commit, without failing it (odoo-lint 0.1.0a8 and later)"
  entry: odl check --force-exclude --exit-zero
  language: python
  files: \.(py|xml|po|pot|js)$
  args: []
  require_serial: true
  verbose: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
- id: odoo-lint-format
  name: odoo-lint format
  description: "Format XML, SCSS, CSS and Less, moving only whitespace (odoo-lint 0.1.0a12 and later)"
  entry: odl format --force-exclude
  language: python
  files: \.(xml|scss|css|less)$
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
- id: odoo-lint-requirements
  name: odoo-lint requirements
  description: "Write requirements.txt from the manifests' external_dependencies (odoo-lint 0.1.0a12 and later)"
  entry: odl requirements
  language: python
  files: (__manifest__\.py|pyproject\.toml)$
  pass_filenames: false
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
- id: odoo-lint-readme
  name: odoo-lint readme
  description: "Build each addon's README.md and static/description/index.html from its readme/ fragments (odoo-lint 0.1.0a8 and later)"
  entry: odl readme
  language: python
  files: (/readme/.*\.md|__manifest__\.py)$
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
